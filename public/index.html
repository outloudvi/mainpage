<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Outvi V</title>

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

    <!-- Keywords -->
    <meta name="keywords" content="your name, industry, and specialties">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->
    <script defer src="https://umami.outv.im/script.js" data-website-id="8ec4dee4-4831-4053-b656-261cb924dc74"></script>

</head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="https://avatars2.githubusercontent.com/u/19144373" alt="Avatar">

            <!-- Replace with your name or brand -->
            <h1>
                <div>Outvi V</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Be off the stage. Be on the stage.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

                <!-- Generic Blog -->
                <a class="button button-blog" href="https://blog.outv.im" target="_blank" rel="noopener" role="button">
                    <div class="flex">
                        <img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="Blog Icon">
                        Blog
                    </div>
                    <div class="slug">blog.outv.im</div>
                </a>

                <!-- Misskey -->
                <a class="button button-misskey" href="https://mk.outv.im/@ov" target="_blank" rel="noopener"
                    role="button">

                        Misskey
                    </div>
                    <div class="slug">@ov@mk.outv.im</div>

                <!-- GnuPG -->
                <a class="button button-default" href="https://github.com/outloudvi/askme/blob/master/pubkey.asc"

                    <div class="flex">
                        <img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon"> GPG
                    </div>
                    <div class="slug">0xA725CB57 CA65CAFE</div>
                </a>

                <!-- Email -->
                <a class="button button-default" href="#" target="_blank" rel="noopener" role="button">
                    <div class="flex">
                        <img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">
                        Email
                    </div>
                    <div class="slug">hello [at] outv.im</div>
                </a>

                <a class="button button-default" href="https://dd.outv.im" target="_blank" rel="noopener"

                    <div>Artists I Love</div>
                    <div></div>

                <a class="button button-default" href="https://ganeid.outv.im" target="_blank" rel="noopener"
                    role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-computer.svg"

                    <div>Me in Gacha Games</div>

                <div class="buttons flex">
                    <a class="button-github" href="https://github.com/outloudvi" target="_blank" rel="noopener"

                    <a class="button-telegram" href="https://t.me/outvi" target="_blank" rel="noopener" role="button">

            <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->

                <a href="https://blog.outv.im/p/privacy-policy/">Privacy Policy</a> | Build your own by forking <a
                    href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
            </footer>

        </div>
    </div>

</html>
